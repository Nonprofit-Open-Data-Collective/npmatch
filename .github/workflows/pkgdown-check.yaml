# Verify that the pkgdown site still builds. This job DOES NOT deploy and DOES
# NOT commit: docs/ is tracked in this repo and rebuilt deliberately by hand,
# so the site is built into a scratch directory outside the checkout and then
# thrown away. The last step fails if the working tree moved at all, which is
# the tripwire for an accidental write into docs/.
#
# What this covers: _pkgdown.yml is hand-curated, exactly like NAMESPACE. A
# newly exported function that nobody added to the `reference:` section makes
# pkgdown abort with "1 topic missing from index" — a breakage that previously
# only showed up if the author happened to rebuild the site before pushing.
name: pkgdown-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pkgdown-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # The articles are the quarto vignettes, so pkgdown shells out to quarto.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # `needs: website` picks up Config/Needs/website, which names
      # Nonprofit-Open-Data-Collective/pkgstyle — the GitHub-hosted template
      # that _pkgdown.yml selects with `template: package: pkgstyle`.
      # `local::.` installs npmatch itself so pkgdown can read its topics.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Check _pkgdown.yml against the package index
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}

      - name: Build the site into a scratch directory and discard it
        run: |
          dest <- file.path(Sys.getenv("RUNNER_TEMP"), "pkgdown-site")
          pkgdown::build_site(
            dest_dir = dest,
            install = FALSE,
            new_process = FALSE,
            preview = FALSE
          )
        shell: Rscript {0}

      - name: Confirm the checkout is unchanged (nothing written to docs/)
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
