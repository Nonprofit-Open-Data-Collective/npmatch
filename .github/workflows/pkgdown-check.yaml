# Verify that the pkgdown site still builds. This job DOES NOT deploy and DOES
# NOT commit: docs/ is tracked in this repo and rebuilt deliberately by hand.
# Everything pkgdown does happens against a scratch COPY of the package under
# $RUNNER_TEMP, so the checkout is never written to at all; the last step
# asserts that, as a tripwire against an accidental write into docs/.
#
# What this covers: _pkgdown.yml is hand-curated, exactly like NAMESPACE. A
# newly exported function that nobody added to the `reference:` section makes
# pkgdown abort with "1 topic missing from index" -- a breakage that previously
# only showed up if the author happened to rebuild the site before pushing.
name: pkgdown-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pkgdown-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown-check:
    runs-on: ubuntu-latest

    env:
      # Nonprofit-Open-Data-Collective/pkgstyle is a PRIVATE repo, and the
      # automatic GITHUB_TOKEN is scoped to this repository only -- it cannot
      # read a sibling private repo, which is why pak reports "Can't find GitHub
      # repo". Set a repo or org secret named NODC_PAT (a PAT with `repo` scope,
      # or a fine-grained token with Contents:read on pkgstyle) and the real
      # template gets used. Without it the job still runs, with the fallback
      # described at the staging step below.
      GITHUB_PAT: ${{ secrets.NODC_PAT || secrets.GITHUB_TOKEN }}
      PKGSRC: ${{ github.workspace }}/../pkgdown-src

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # The articles are the quarto vignettes, so pkgdown shells out to quarto.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Deliberately NOT `needs: website`. That would pull Config/Needs/website
      # (pkgstyle) into the pak solve, and an unreachable private repo there is a
      # hard resolution failure that kills the job before anything is checked.
      # pkgstyle is installed separately below, where it is allowed to fail.
      # `local::.` installs npmatch itself so pkgdown can read its topics.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.

      - name: Install the pkgstyle template if it is reachable
        id: pkgstyle
        continue-on-error: true
        run: pak::pkg_install("Nonprofit-Open-Data-Collective/pkgstyle")
        shell: Rscript {0}

      # Everything below runs against $PKGSRC, a copy, for two reasons: the real
      # checkout can then never be written to, and the copy's _pkgdown.yml can be
      # adjusted without dirtying the tree.
      #
      # _pkgdown.yml sets `template: package: pkgstyle`. pkgdown resolves that
      # eagerly in as_pkgdown(), so BOTH check_pkgdown() and build_site() abort
      # with "Template package "pkgstyle" is not installed" when the private repo
      # was unreachable -- there is no override that gets you past it, which is
      # why the key is dropped from the file itself. Only that one line goes;
      # `includes: after_body:` (the mermaid loader) stays. The site then renders
      # with pkgdown's default template, which is the right trade: this job
      # exists to prove the reference index, the articles and the topic
      # resolution are intact, not to review the CSS. The real template is
      # exercised whenever NODC_PAT is present.
      - name: Stage a scratch copy of the package
        run: |
          set -euo pipefail
          rm -rf "$PKGSRC"
          mkdir -p "$PKGSRC"
          rsync -a --exclude .git --exclude docs ./ "$PKGSRC"/
          if Rscript -e 'if (!requireNamespace("pkgstyle", quietly = TRUE)) quit(status = 1)'; then
            echo "pkgstyle is installed; building with the real NODC template."
          else
            echo "::notice::pkgstyle is not installed (private repo, no NODC_PAT secret). Dropping 'template: package:' and building with pkgdown's default template. The site structure is still fully checked."
            sed -i '/^  package: pkgstyle$/d' "$PKGSRC/_pkgdown.yml"
            grep -q 'package: pkgstyle' "$PKGSRC/_pkgdown.yml" && exit 1
            sed -n '1,12p' "$PKGSRC/_pkgdown.yml"
          fi

      # This is the check that would have caught the missing reference: topic.
      - name: Check _pkgdown.yml against the package index
        run: pkgdown::check_pkgdown(Sys.getenv("PKGSRC"))
        shell: Rscript {0}

      # build_site() has no dest_dir argument -- that one belongs to
      # build_site_github_pages(). The destination comes from _pkgdown.yml
      # (`destination: docs`) and is overridden here to an absolute scratch
      # path. $PKGSRC is already outside the checkout, so this is belt and
      # braces, but it keeps the intent explicit and the output easy to find.
      - name: Build the site into a scratch directory and discard it
        run: |
          pkgdown::build_site(
            pkg = Sys.getenv("PKGSRC"),
            override = list(
              destination = file.path(Sys.getenv("RUNNER_TEMP"), "pkgdown-site")
            ),
            install = FALSE,
            new_process = FALSE,
            preview = FALSE
          )
        shell: Rscript {0}

      - name: Confirm the checkout is unchanged (nothing written to docs/)
        if: always()
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
