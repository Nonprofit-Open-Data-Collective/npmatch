# R CMD check on every PR to main and every push to main.
#
# What this covers that nothing else did: the package is installed from a
# source tarball into a clean library, so DESCRIPTION is the only thing that
# decides which versions of the siblings show up. setup-r-dependencies honors
# the `Remotes:` field, so npnormalize comes from GitHub at the version the
# `Imports:` floor asks for. A call to a function that only exists in a newer
# npnormalize than the floor declares now fails here instead of failing for
# whoever installs the package as written.
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # DESCRIPTION declares `VignetteBuilder: quarto` and every vignette is a
      # .qmd with %\VignetteEngine{quarto::html}, so the quarto CLI has to be
      # on PATH before the check or the vignette build fails outright. If this
      # ever turns flaky, the fallback is to pass --no-build-vignettes to the
      # check below and lose vignette coverage; keep the real build while it
      # works, since the vignettes execute package code.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          http-user-agent: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # error-on is "error", not the r-lib default of "warning". `main` already
      # carries three R CMD check WARNINGs, none of them introduced here and
      # none fixable without touching files this PR deliberately leaves alone:
      #
      #   * non-ASCII characters in R/report.R
      #   * data codoc mismatch in npmatch_groundtruth.Rd (the documented
      #     columns are a subset of the actual ones)
      #   * undocumented arguments: `...` in np_fetch_bmf / np_fetch_sam,
      #     `config` in np_select
      #
      # Plus two NOTEs: no importFrom for stats::na.omit and utils::count.fields,
      # and `rpart` used in a vignette without being declared. Every one of those
      # lives in R source, man/, NAMESPACE or DESCRIPTION. Gating on warnings
      # would make this job red on arrival and teach everyone to ignore it. The
      # defects worth catching here surface as ERRORs anyway: a call into a
      # sibling package that the DESCRIPTION floor does not actually provide
      # fails the examples or the test suite, not the warning tally. Tighten this
      # to "warning" once the six items above are cleared.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
          error-on: '"error"'
