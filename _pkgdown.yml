reference:
- title: Run projects & stage drivers
  desc: >
    Scaffold a run directory, address files inside it, drive each stage, and
    report on progress. See the Workflow article for the layout these produce.
  contents:
  - np_project_init
  - np_project_use
  - np_project_root
  - np_project_path
  - np_project_status
  - np_stage_schema
  - np_stage1_run
  - np_stage2_run
  - np_stage3_run
  - np_final_run
  - np_gate_rules
  - np_entity_gate
  - np_merge_decisions
- title: Match pipeline
  desc: >
    Tiers 3–6: pre-prep the reference corpus, generate candidates by blocking,
    compare and score them, apply the veto rules, select and tier. `np_cascade()`
    orchestrates all of it, and takes a matchdb reference directly.
  contents:
  - np_cascade
  - np_match
  - np_block
  - np_block_union
  - np_ref_index
  - np_compare
  - np_score
  - np_veto
  - np_select
  - np_tier
  - np_route
- title: Entity families
  desc: >
    Roll a query up to the family its candidates belong to — a chapter of a
    federation, a hospital system, a school and its PTO — and tell a contest
    between strangers from one within a family. Both take cluster membership
    from [matchdb](https://nonprofit-open-data-collective.github.io/matchdb/)
    (`cluster_member` joined to `cluster`).
  contents:
  - np_cluster_rollup
  - np_pair_links
- title: Batched matching
  desc: Run the stage-1 cascade over a large source in evenly sized chunks.
  contents:
  - np_batch
  - np_run_batches
- title: Setup & standardization
  desc: >
    Tier 2: map any dataset onto the canonical fields, from which every later
    tier works. The standardization itself — `np_normalize()`, `np_name_core()`,
    the name, token and address statistics, and the signature that pins them —
    lives in [npnormalize](https://nonprofit-open-data-collective.github.io/npnormalize/)
    and is re-exported here unchanged. `np_map_sam()` / `np_map_bmf()` are the
    maps for the SAM-to-BMF deployment; write your own for another one.
  contents:
  - np_config
  - np_fields
  - np_query
  - np_reference
  - reexports
  - np_map_bmf
  - np_map_sam
  - np_flag_active
  - np_geo_profiles
  - np_detect_geo
- title: Rules, distinctiveness & training
  desc: Do-not-match rules, token/name statistics, and model benchmarking.
  contents:
  - np_default_rules
  - np_rule
  - np_rule_legal_form
  - np_default_passes
  - np_default_weights
  - np_default_geo_weights
  - np_train
  - np_benchmark
  - np_auc
  - np_evaluate
  - np_tune_thresholds
- title: Review & labeling hand-off
  desc: >
    Tier 6: package what the algorithm could not settle. Review frames, LLM
    prompts, and calibration/labeling tools.
  contents:
  - np_label_frame
  - np_calibration_frame
  - np_label
  - np_preview_pair
  - np_veto_audit
  - np_bmf_review_fields
  - np_sam_review_fields
  - np_as_prompt
  - np_as_prompts
  - np_review_report
- title: Data management, fetching & reporting
  desc: >
    Resolve data assets, fetch/prepare source files, run incremental diffs, and
    report on a run. These build a reference from raw NCCS BMF and SAM files;
    [matchdb](https://nonprofit-open-data-collective.github.io/matchdb/) is the
    shorter path to a reference, and supplies tier 1 (alias enumeration) as well.
  contents:
  - np_data_root
  - np_data_path
  - np_data_init
  - np_manifest
  - np_manifest_add
  - np_source_urls
  - np_fetch
  - np_fetch_bmf
  - np_fetch_sam
  - np_read_sam
  - np_sam_layout
  - np_flag_nonprofits
  - np_prepare_sam
  - np_diff_unmatched
  - np_run_report
- title: Datasets
  desc: The hand-labeled 1,502-org training/evaluation benchmark.
  contents:
  - npmatch_eval
  - npmatch_groundtruth
- title: Geography helpers
  contents:
  - np_clean_geo
  - np_city_aliases
  - np_augment_geo
  - np_ruca_urban
  - np_load_hud
  - np_load_ruca
  - np_load_zipcode_db
