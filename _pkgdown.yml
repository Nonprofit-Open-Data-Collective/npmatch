  - np_project_use
  - np_project_root
  - np_project_path
  - np_project_status
  - np_stage_schema
  - np_stage1_run
  - np_stage2_run
  - np_stage3_run
  - np_final_run
  - np_gate_rules
  - np_entity_gate
  - np_merge_decisions
