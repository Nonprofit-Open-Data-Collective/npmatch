url: https://nonprofit-open-data-collective.github.io/npmatch/

template:
  bootstrap: 5
  bslib:
    primary: "#B22222"        # firebrick, matching the guide accents
    link-color: "#AF7817"

navbar:
  structure:
    left:  [reference, articles]
    right: [search, github]

articles:
- title: Guides
  navbar: ~
  contents:
  - reviewer-guide
  - candidate-evaluation-frame

reference:
