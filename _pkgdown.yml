url: https://nonprofit-open-data-collective.github.io/npmatch/

template:
  bootstrap: 5
  bslib:
    primary: "#B22222"        # firebrick, matching the guide accents
    link-color: "#AF7817"

navbar:
  structure:
    left:  [workflow, reference, articles]
    right: [search, github]
  components:
    workflow:
      text: Workflow
      href: articles/workflow.html

articles:
- title: Guides
  navbar: ~
  contents:
  - workflow
  - reviewer-guide
  - training-dataset
  - building-a-classifier
  - candidate-evaluation-frame

reference:
- title: Run projects & stage drivers
  desc: >
    Scaffold a run directory, address files inside it, drive each stage, and
    report on progress. See the Workflow article for the layout these produce.
  contents:
